# Copiá este archivo a settings.yaml (en la misma carpeta) y completá tu API key
# de Groq, o simplemente definí la variable de entorno GROQ_API_KEY y dejá
# groq_api_key vacío/como placeholder — el código prioriza la variable de entorno.
#
#   cp config/settings.example.yaml config/settings.yaml
#
# settings.yaml está en .gitignore: no se sube al repo con tu API key real.

llm:
  provider: groq
  groq_api_key: "${GROQ_API_KEY}"   # o pegá tu key acá directamente
  modelo: "openai/gpt-oss-20b"
  candidatos_por_ejecucion: 3
  max_reintentos: 3

guion:
  palabras_por_minuto: 150       # para estimar duración de narración
  duracion_objetivo_seg: [60, 90]
  # Rotación automática cuando no se fuerza un nicho puntual. No hace falta
  # que esté acá para poder usarlo: tanto la CLI (--nicho) como la webapp
  # aceptan cualquier texto libre como override, sin editar este archivo.
  nichos: [
    tecnologia, programacion, videojuegos, peliculas,
    belleza, moda, cocina, salud_bienestar, fitness,
    finanzas_personales, viajes, mascotas, curiosidades,
    motivacion, humor, diy_manualidades,
  ]

broll:
  proveedor: pexels              # pexels | pixabay
  api_key: "${PEXELS_API_KEY}"   # o PIXABAY_API_KEY si proveedor: pixabay
  clips_por_video: [3, 5]
  max_reintentos: 3
  # 0 = todo banco de stock (default, sin cambios de comportamiento).
  # Entre 0 y 1 = esa fracción de los clips se genera con IA en vez de
  # buscarse en el banco (útil para temas que el banco no va a tener, ej.
  # personajes/videojuegos puntuales). 1 = siempre IA. Gratis, sin API key
  # (Pollinations.ai) — ver common/imagen_ia.py. También se usa como último
  # recurso si el banco de stock no encuentra nada para una palabra clave.
  ratio_ia: 0

whisper:
  modelo: small        # tiny | base | small | medium (más grande = más preciso y más lento)
  idioma: es
  device: cpu
  compute_type: int8

video:
  formato: vertical               # 1080x1920
  ancho: 1080
  alto: 1920
  fps: 30
  preset: veryfast                 # calidad/velocidad de ffmpeg; "medium" da mejor calidad pero usa más RAM/tiempo
  threads: 2
  transicion_seg: 0.4              # crossfade entre segmentos de B-roll (0 para cortes secos, como antes)
  subtitulos_estilo: simple        # simple | karaoke (fase 3)
  fuente: null                     # ruta a un .ttf/.otf, o null para usar assets/fonts/BigShoulders-Bold.ttf
  tam_fuente: 64
  color_texto: white
  color_borde: black
  subtitulo_fondo_opacidad: 0.45   # caja semitransparente detrás del texto (0 para sacarla)
  subtitulo_pos_y: 0.78            # posición vertical relativa (0=arriba, 1=abajo)
  intro: "assets/intro_outro/intro.mp4"   # opcional; se omite si el archivo no existe
  outro: "assets/intro_outro/outro.mp4"   # opcional; se omite si el archivo no existe

audio:
  limpiar: true    # denoise + normalización de volumen (ffmpeg) antes de transcribir/ensamblar

musica:
  activar: true         # si hay algo en assets/musica/, se mezcla de fondo; si la carpeta está vacía, no hace nada
  volumen: 0.15          # volumen relativo de la música contra la narración (0-1)

historial:
  ruta: "history/historial_guiones.json"
  evitar_repetir_dias: 14

logging:
  ruta: "logs/"
  nivel: INFO
